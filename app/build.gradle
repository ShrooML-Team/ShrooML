plugins {
    id 'com.android.application'
    id 'jacoco'
    //id 'java'
}

android {
    //namespace 'codepath.demos.helloworlddemo'
    namespace 'com.shrooml'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.shrooml"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "KINDWISE_API_KEY_1", "\"${KINDWISE_API_KEY_1}\""
        buildConfigField "String", "KINDWISE_API_KEY_2", "\"${KINDWISE_API_KEY_2}\""
        buildConfigField "String", "KINDWISE_API_KEY_3", "\"${KINDWISE_API_KEY_3}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

}

jacoco {
    toolVersion = '0.8.12'
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def fileFilter = [
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*'
    ]

    def debugJavaClasses = fileTree(dir: "$buildDir/intermediates/javac/debug/classes", excludes: fileFilter)

    classDirectories.setFrom(files(debugJavaClasses))
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(fileTree(dir: buildDir, includes: [
            'jacoco/testDebugUnitTest.exec',
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
            '**/*.exec',
            '**/*.ec'
    ]))
}